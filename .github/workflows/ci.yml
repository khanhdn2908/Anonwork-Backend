name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Anonwork-Backend.sln

      - name: Build solution
        run: dotnet build Anonwork-Backend.sln --configuration Release --no-restore

      - name: Run unit tests
        shell: bash
        run: |
          unit_test_projects=$(find . -name '*UnitTest*.csproj' -o -name '*UnitTests*.csproj' -o -name '*Tests*.csproj' | grep -v 'Integration' || true)
          if [ -z "$unit_test_projects" ]; then
            echo "No unit test project found; skipping unit tests."
            exit 0
          fi

          for project in $unit_test_projects; do
            dotnet test "$project" --configuration Release --no-build --verbosity normal
          done

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anonwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anonwork_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=anonwork_test;Username=postgres;Password=postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore dependencies
        run: dotnet restore Anonwork-Backend.sln

      - name: Build solution
        run: dotnet build Anonwork-Backend.sln --configuration Release --no-restore

      - name: Apply database migrations
        shell: bash
        run: |
          if [ -f ".config/dotnet-tools.json" ]; then
            dotnet tool restore
          else
            dotnet tool install --global dotnet-ef --version 8.0.0
            export PATH="$PATH:$HOME/.dotnet/tools"
          fi

          dotnet ef database update \
            --project src/Anonwork.Infrastructure/Anonwork.Infrastructure.csproj \
            --startup-project src/Anonwork.API/Anonwork.API.csproj \
            --context AppDbContext

      - name: Run integration tests
        shell: bash
        run: |
          integration_test_projects=$(find . -name '*IntegrationTest*.csproj' -o -name '*IntegrationTests*.csproj' || true)
          if [ -z "$integration_test_projects" ]; then
            echo "No integration test project found; skipping integration tests."
            exit 0
          fi

          for project in $integration_test_projects; do
            dotnet test "$project" --configuration Release --no-build --verbosity normal
          done
